version: '3.8'
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: schaf
      POSTGRES_PASSWORD: schafpass
      POSTGRES_DB: schlafschaf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://schaf:schafpass@db:5432/schlafschaf
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata:
